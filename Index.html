<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Queue Repeat Visitor Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #eee;
      text-align: center;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 5px;
      margin-bottom: 12px;
      font-size: 1.25rem;
    }
    .container {
      position: relative;
      display: inline-block;
      max-width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    video {
      display: block;
      width: 100%;
      max-width: 640px;
      height: auto;
      object-fit: cover;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .controls {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:active {
      background: #3a3a3a;
    }
    .btn.active {
      background: #ffcc00;
      color: #000;
      border-color: #ffcc00;
      font-weight: bold;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #status {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 8px;
    }
    #log {
      margin-top: 12px;
      height: 150px;
      overflow-y: auto;
      text-align: left;
      max-width: 640px;
      margin-left: auto;
      margin-right: auto;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .alert { color: #ff4d4d; font-weight: bold; }
    .ok { color: #4dff88; }
    .warn { color: #ffdd55; }
  </style>
</head>
<body>
  <h2>Queue Repeat Visitor Monitor</h2>
  <div class="container">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="controls">
    <button id="torchBtn" class="btn" disabled>🔦 Flash: Off</button>
  </div>

  <div id="status">Tap anywhere on the screen to enable audio alert...</div>
  <div id="log"></div>

  <script>
    const MATCH_THRESHOLD = 0.55;       // Distance cutoff (lower = stricter)
    const REPEAT_WINDOW_SEC = 300;       // Flag if seen again within 5 minutes
    const DEBOUNCE_SEC = 30;             // Delay: ignore repeats within 30 seconds

    let visitors = []; // [{ id, descriptor, timestamps: [] }]
    let nextId = 1;

    const video = document.getElementById('video');
    const canvas = document.getElementById('overlay');
    const logBox = document.getElementById('log');
    const statusBox = document.getElementById('status');
    const torchBtn = document.getElementById('torchBtn');

    let audioCtx = null;
    let videoTrack = null;
    let isTorchOn = false;

    // --- High Loud Industrial Siren Alert ---
    function playAlertBeep() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;

      const masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.8, now);
      masterGain.connect(audioCtx.destination);

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();

      osc1.type = 'sawtooth';
      osc2.type = 'square';

      const pulseDuration = 0.12;
      for (let i = 0; i < 3; i++) {
        const t = now + i * (pulseDuration * 2);
        osc1.frequency.setValueAtTime(1300, t);
        osc2.frequency.setValueAtTime(1305, t);

        osc1.frequency.setValueAtTime(750, t + pulseDuration);
        osc2.frequency.setValueAtTime(755, t + pulseDuration);
      }

      osc1.connect(masterGain);
      osc2.connect(masterGain);

      const totalDuration = pulseDuration * 6;
      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + totalDuration);
      osc2.stop(now + totalDuration);
    }

    // --- Flash / Torch Controller ---
    async function setupTorch(track) {
      videoTrack = track;
      try {
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.torch) {
          torchBtn.disabled = false;
          torchBtn.addEventListener('click', toggleTorch);
        } else {
          torchBtn.textContent = "🔦 Flash Not Supported";
          torchBtn.disabled = true;
        }
      } catch (e) {
        torchBtn.textContent = "🔦 Flash Unavailable";
        torchBtn.disabled = true;
      }
    }

    async function toggleTorch() {
      if (!videoTrack) return;
      try {
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({
          advanced: [{ torch: isTorchOn }]
        });
        torchBtn.textContent = isTorchOn ? "🔦 Flash: ON" : "🔦 Flash: OFF";
        torchBtn.classList.toggle('active', isTorchOn);
      } catch (err) {
        console.error("Torch error:", err);
        log(`Torch Error: ${err.message}`, "warn");
      }
    }

    function log(msg, type = "ok") {
      const p = document.createElement('div');
      p.className = type;
      p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logBox.prepend(p);
    }

    async function init() {
      window.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        statusBox.textContent = "Audio active. Monitoring queue...";
      }, { once: true });

      statusBox.textContent = "Loading face models...";
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

      statusBox.textContent = "Requesting back camera...";

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { exact: "environment" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });
      } catch (err) {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment",
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });
      }

      video.srcObject = stream;
      const track = stream.getVideoTracks()[0];
      if (track) setupTorch(track);

      video.onloadedmetadata = () => {
        statusBox.textContent = "Camera ready. Tap screen once to ensure sound is primed.";
        processVideo();
      };
    }

    async function processVideo() {
      const displaySize = { width: video.videoWidth || 640, height: video.videoHeight || 480 };
      faceapi.matchDimensions(canvas, displaySize);

      setInterval(async () => {
        if (video.paused || video.ended) return;

        const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
          .withFaceLandmarks()
          .withFaceDescriptors();

        const resizedDetections = faceapi.resizeResults(detections, displaySize);
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const now = Date.now() / 1000;

        for (const det of resizedDetections) {
          const descriptor = det.descriptor;
          let bestMatch = null;
          let minDistance = Infinity;

          for (const visitor of visitors) {
            const dist = faceapi.euclideanDistance(descriptor, visitor.descriptor);
            if (dist < minDistance) {
              minDistance = dist;
              bestMatch = visitor;
            }
          }

          let label = "";
          let color = "#4dff88"; // Green

          if (minDistance < MATCH_THRESHOLD && bestMatch) {
            const lastSeen = bestMatch.timestamps[bestMatch.timestamps.length - 1];
            const diff = now - lastSeen;

            // Debounce check: within 30 seconds of registration / previous detection
            if (diff < DEBOUNCE_SEC) {
              label = `ID #${bestMatch.id} (Wait ${Math.ceil(DEBOUNCE_SEC - diff)}s)`;
              color = "#ffdd55"; // Yellow (cooldown active, no alarm)
            } else if (diff <= REPEAT_WINDOW_SEC) {
              bestMatch.timestamps.push(now);
              label = `REPEAT ALERT: ID #${bestMatch.id}!`;
              color = "#ff4d4d"; // Red
              log(`ALERT: Repeat visitor detected! ID #${bestMatch.id}`, "alert");
              playAlertBeep();
            } else {
              bestMatch.timestamps.push(now);
              label = `ID #${bestMatch.id} (Valid Return)`;
              color = "#4dff88";
              log(`ID #${bestMatch.id} returned after window elapsed`, "ok");
            }
          } else {
            const id = nextId++;
            visitors.push({ id, descriptor, timestamps: [now] });
            label = `ID #${id} (New)`;
            log(`New visitor registered: ID #${id}`, "ok");
          }

          const box = det.detection.box;
          new faceapi.draw.DrawBox(box, { label, boxColor: color }).draw(canvas);
        }
      }, 300);
    }

    init().catch(err => {
      console.error(err);
      statusBox.textContent = `Error: ${err.message}. Make sure HTTPS is used.`;
    });
  </script>
</body>
</html>
